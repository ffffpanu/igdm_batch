<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>IG HiRes Downloader</title>
  <style>
    :root { color-scheme: light dark; }
    body { width: 300px; margin: 0; padding: 14px; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; opacity: .65; margin: 16px 0 6px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
    .grid div { padding: 6px 0; border-radius: 8px; background: rgba(128,128,128,.14); }
    .grid b { display: block; font-size: 18px; }
    .grid span { font-size: 11px; opacity: .7; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    button { flex: 1; padding: 7px 8px; border: 0; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 600; background: #0095f6; color: #fff; }
    button.secondary { background: rgba(128,128,128,.22); color: inherit; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
    select, input[type=number] { width: 120px; padding: 4px; }
    #errors { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12px; color: #e53935; max-height: 80px; overflow: auto; }
    small { display: block; margin-top: 10px; opacity: .6; }
  </style>
</head>
<body>
  <h1>IG HiRes Downloader</h1>

  <div class="grid">
    <div><b id="done">0</b><span>done</span></div>
    <div><b id="active">0</b><span>active</span></div>
    <div><b id="queued">0</b><span>queued</span></div>
    <div><b id="failed">0</b><span>failed</span></div>
  </div>
  <div class="row">
    <button id="cancel" class="secondary">Cancel pending</button>
    <button id="retry" class="secondary">Retry failed</button>
  </div>
  <ul id="errors"></ul>

  <h2>Settings</h2>
  <label>Profile scope
    <select id="profileScope">
      <option value="loaded">Loaded in grid</option>
      <option value="all">All posts (API)</option>
    </select>
  </label>
  <label>Video quality
    <select id="videoMode">
      <option value="progressive">Standard (≈720p, 1 file)</option>
      <option value="dash">Highest (video + audio files)</option>
    </select>
  </label>
  <label>Max posts (All)
    <input id="maxPosts" type="number" min="1" max="2000" step="10">
  </label>
  <label>Parallel downloads
    <input id="concurrency" type="number" min="1" max="6">
  </label>
  <label>Save in Instagram/&lt;user&gt;/
    <input id="organizeByUser" type="checkbox">
  </label>

  <small>Files are saved to your browser's Downloads folder. For personal use only — respect creators' rights.</small>
  <script src="popup.js"></script>
</body>
</html>
